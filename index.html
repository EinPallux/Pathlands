<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta name="description" content="Pathlands — a browser-playable 3D action RPG." />
    <title>Pathlands</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0d'/%3E%3Cpath d='M16 5 L23 27 L16 22 L9 27 Z' fill='%23ff7a2e'/%3E%3C/svg%3E"

  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
      <div id="boot-screen">
        <div class="boot-logo">PATHLANDS</div>
        <div class="boot-sub">Walk the broken paths</div>
        <div class="boot-bar"><div class="boot-bar-fill" id="boot-bar-fill"></div></div>
        <div class="boot-status" id="boot-status">Kindling the last lantern…</div>

    </div>
    <noscript>
      <div style="color: #ddd; font-family: sans-serif; padding: 2rem">
        Pathlands requires JavaScript and a WebGL2-capable browser.
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>

</html>
